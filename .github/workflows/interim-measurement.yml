# Monthly interim measurement.
#
# Collects and scores every index, then archives a dated measurement to
# data/<index>/history/<YYYY-MM>.json. It does NOT publish: no site pages are
# generated, no ranking is updated, and data/<index>/<quarter>.json — the
# receipt for what the site published — is never touched.
#
# Why it lives here and not in the site repo: this repo is public, so Actions
# minutes are free; the site repo is private with Actions disabled. The split
# also matches the boundary in CLAUDE.md — collection and snapshots belong to
# the pipeline, publishing belongs to the site.
#
# Why publishing stays manual: collect.mjs spends real money, and a ranking
# that businesses are judged by should have a human look at it before it goes
# out. Both are deliberate, not unfinished.

name: Monthly interim measurement

on:
  # NOTE: GitHub disables scheduled workflows on a repository after 60 days
  # with no activity. A monthly run that commits keeps the repo inside that
  # window, but if the schedule ever stops firing, that is the first thing to
  # check — re-enable it on the Actions tab.
  #
  # DELIBERATELY only these two triggers. Never add pull_request or
  # pull_request_target: this workflow holds a credential that spends money,
  # and in a public repo a forked PR must never be able to reach it.
  schedule:
    # 03:37 UTC on the 1st. The odd minute is deliberate: GitHub delays
    # scheduled runs under load, and load peaks on the hour — a job set to
    # :00 on the 1st of the month queues behind everyone else's monthly cron.
    # Nothing here is time-critical, but an offset makes it start sooner and
    # reduces the chance of being dropped outright.
    - cron: '37 3 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Estimate cost and fetch nothing'
        type: boolean
        default: false
      indices:
        description: 'Space-separated slugs, or blank for all'
        type: string
        default: ''

permissions:
  contents: write

# Serialise runs. Two concurrent collections against the same DataForSEO
# account corrupt cost reconciliation — spend is attributed by time window,
# so an overlapping run lands in the other run's ledger.
concurrency:
  group: interim-measurement
  cancel-in-progress: false

jobs:
  # One index per job, run one at a time.
  #
  # A single job is capped at 6 hours by GitHub. Eleven indices at roughly 90
  # minutes each — the SERP standard queue alone can take 45 — is about 16
  # hours, so the old single-job design would have been killed halfway through
  # the first scheduled run, after spending the money.
  #
  # max-parallel: 1 keeps them strictly sequential, which the cost model
  # requires: DataForSEO spend is reconciled by time window via id_list, so two
  # concurrent collections land in each other's ledger.
  plan:
    if: github.repository == 'philyarrow/local-digital-visibility-index'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          if [ -n "${{ inputs.indices }}" ]; then
            SLUGS="${{ inputs.indices }}"
          else
            SLUGS=$(node -e "
              const c = require('./pipeline/config/indices.json');
              console.log(Object.keys(c).filter(k => !k.startsWith('_')).join(' '));
            ")
          fi
          MATRIX=$(node -e "
            const s = process.argv[1].trim().split(/\s+/).filter(Boolean);
            console.log(JSON.stringify({ slug: s }));
          " "$SLUGS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Indices: $SLUGS" >> "$GITHUB_STEP_SUMMARY"

  measure:
    # Forks inherit the workflow file but must never run it on a schedule.
    if: github.repository == 'philyarrow/local-digital-visibility-index'
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Per INDEX, not per run: each matrix job collects one index. The SERP
    # standard queue alone can take 45 minutes and a 41-firm cohort adds ~60s
    # per business for the crawl, so ~90 minutes is normal and 330 leaves
    # headroom while staying under GitHub's 6-hour job cap.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependency install: the pipeline imports only Node builtins.

      - name: Collect, score, archive
        working-directory: pipeline
        env:
          DATAFORSEO_AUTH: ${{ secrets.DATAFORSEO_AUTH }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          set -euo pipefail

          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
            echo "::notice::Dry run — nothing will be fetched or charged."
          fi

          # Checked only for real runs: collect.mjs --dry-run makes no API calls
          # and needs no credential, so a dry run is a way to validate this
          # workflow BEFORE the secret exists.
          if [ -z "$DRY" ] && [ -z "${DATAFORSEO_AUTH:-}" ]; then
            echo "::error::DATAFORSEO_AUTH is not set. Add it under Settings → Secrets and variables → Actions, or re-run with dry_run enabled."
            exit 1
          fi

          # Sequential on purpose. See the concurrency note above: parallel
          # collection breaks per-run cost attribution.
          slug='${{ matrix.slug }}'
          if [ ! -f "seeds/$slug.csv" ]; then
            echo "::error::seeds/$slug.csv is missing. An index must have a reviewed seed before it is collected."
            exit 1
          fi
          node collect.mjs "seeds/$slug.csv" $DRY
          if [ -z "$DRY" ]; then
            node score.mjs "$slug"
            node generate.mjs "$slug" --archive-only
          fi

      - name: Summarise spend
        if: inputs.dry_run != true
        run: |
          node -e "
            const fs = require('fs');
            const glob = fs.readdirSync('pipeline/data', { withFileTypes: true })
              .filter(d => d.isDirectory())
              .map(d => 'pipeline/data/' + d.name + '/_cost.json')
              .filter(fs.existsSync);
            let usd = 0, gbp = 0;
            const rows = glob.map(f => {
              const c = JSON.parse(fs.readFileSync(f, 'utf8'));
              usd += c.ledgerUsd || 0; gbp += c.ledgerGbp || 0;
              return \`| \${c.index} | \${c.businesses} | \$\${(c.ledgerUsd || 0).toFixed(4)} |\`;
            });
            const out = ['| Index | Businesses | Cost |', '|---|---:|---:|', ...rows,
              \`| **Total** | | **\$\${usd.toFixed(2)} / £\${gbp.toFixed(2)}** |\`].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
          "

      - name: Commit the interim measurement
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Only the history directory. If anything else changed, that is a bug
          # in --archive-only and the run should fail loudly rather than commit
          # over a published snapshot.
          if ! git diff --quiet -- data ':!data/*/history'; then
            echo "::error::A published snapshot was modified. --archive-only must only write data/<index>/history/."
            git --no-pager diff --stat -- data ':!data/*/history'
            exit 1
          fi

          # `git add data` is safe because the guard above already proved
          # nothing outside data/*/history changed.
          # Another matrix job may have pushed since checkout.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add data
          if git diff --cached --quiet; then
            echo "No change to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PERIOD=$(date -u +%Y-%m)
          git commit \
            -m "Interim measurement $PERIOD" \
            -m "Automated monthly collection. Not a published ranking: the site still shows the last published quarter, and data/<index>/<quarter>.json is unchanged. These files exist so movement over time can be analysed."
          git push
